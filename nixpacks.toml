# Fallback if Railway uses Nixpacks instead of Dockerfile.
# Use python -m pip (pip is not on PATH until Python provider runs).

providers = ["python", "node"]

[phases.install]
cmds = [
  "python -m pip install -r requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "python -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
